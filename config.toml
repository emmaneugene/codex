model = "gpt-5.5"
model_reasoning_effort = "low"
personality = "friendly"
web_search = "cached"
sandbox_mode = "danger-full-access"

[features]
hooks = true
memories = false
js_repl = false
multi_agent = true
terminal_resize_reflow = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
DISABLE_TELEMETRY = "1"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "thread-id", "run-state", "context-used"]
status_line_use_colors = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
[desktop]
ambient-suggestions-enabled = false
appearanceTheme = "dark"
appearanceDarkCodeThemeId = "one"
sansFontSize = 12
codeFontSize = 10
usePointerCursors = true
mac-menu-bar-enabled = false
conversationDetailMode = "STEPS_COMMANDS"
notifications-turn-mode = "always"
localeOverride = "en-US"
show-context-window-usage = true

[desktop.appearanceDarkChromeTheme]
accent = "#4d78cc"
contrast = 50
ink = "#abb2bf"
opaqueWindows = false
surface = "#282c34"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Hack Nerd Font"'
ui = "Geist, Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#8cc265"
diffRemoved = "#e05561"
skill = "#c162de"

[desktop.open-in-target-preferences]
global = "zed"

